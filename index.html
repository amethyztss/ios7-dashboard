<style>
*{box-sizing:border-box}

.p{margin-bottom:16px}

.sw.on{background:#4cd964;border-color:#4cd964}.sw.on i{left:20px}
input[type=range]{-webkit-appearance:none;width:100%;height:30px;background:transparent;margin:0}

.sl{padding:0 16px 12px;border-bottom:1px solid #c8c7cc}
.dots span{display:inline-block;width:32px;height:32px;border-radius:16px;margin:2px 10px 2px 0;border:1px solid #c8c7cc}
.badge{font-size:11px;padding:2px 6px;border-radius:4px;color:#fff;background:#ff9500;margin-left:8px;vertical-align:middle}.badge.live{background:#4cd964}
.btn{color:#007aff;font-size:17px;padding:8px 0}
table{width:100%;border-collapse:collapse;text-align:center;font-size:16px}th{font-weight:400;color:#8e8e93;font-size:12px;padding:4px}
td{height:34px}td b{display:inline-block;width:30px;height:30px;line-height:30px;border-radius:15px;font-weight:400}

.seg{display:inline-flex;border:1px solid #007aff;border-radius:4px;overflow:hidden}.seg span{padding:6px 12px;font-size:15px;color:#007aff;border-left:1px solid #007aff}.seg span:first-child{border:0}.seg span.on{background:#007aff;color:#fff}
input[type=text],textarea{font:inherit;font-size:17px;border:0;text-align:right;width:60%;background:transparent;color:#8e8e93;-webkit-user-select:text}
textarea{width:100%;height:120px;font:13px monospace;text-align:left;border-top:1px solid #c8c7cc;padding:8px 16px}
#tabs{height:56px;display:flex;background:#f7f7f7;border-top:1px solid #b2b2b2}
.tab{flex:1;text-align:center;color:#8e8e93;font-size:10px;padding-top:6px}.tab.on{color:#007aff}
.tab svg{display:block;margin:0 auto 2px;width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5}
.p-wx,#p-set,#p-clock{}
#p-set{display:none}
#main[data-t=wx] .p,#main[data-t=cal] .p,#main[data-t=acc] .p,#main[data-t=set] .p{display:none}
#main[data-t=wx] #p-wx,#main[data-t=cal] #p-cal,#main[data-t=acc] #p-acc,#main[data-t=set] #p-set{display:block}
#main:not([data-t=home]) #cols{display:block}
body.night{background:#000;color:#8a8a8f}body.night #nav,body.night #tabs{background:#0b0b0b;border-color:#222}
body.night .card{background:#0d0d0d;border-color:#222}body.night .row,body.night .ev,body.night .sl{border-color:#222}
@media (orientation:portrait){#cols{display:block}.time{font-size:110px;line-height:110px}}
</style></head><body>
<div id="app"><div id="nav"><span id="ttl">Home</span><div id="st"></div></div>

<script>
(function(){
var K="ios7dash",DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],MON=["January","February","March","April","May","June","July","August","September","October","November","December"];

var D={h24:false,sec:false,date:true,units:"f",loc:"Trenton",refresh:15,ics:"",days:7,mode:"demo",url:"",night:false,accent:"#007aff",devs:DD};
var S={};function $(i){return document.getElementById(i)}
var memOk=true;function load(){var o={};try{o=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){memOk=false}for(var k in D)S[k]=o.hasOwnProperty(k)?o[k]:D[k]}

function xhr(m,u,b,cb){var r=new XMLHttpRequest(),d=false;function f(e,t){if(!d){d=true;cb(e,t)}}r.open(m,u,true);r.timeout=15000;if(b)r.setRequestHeader("Content-Type","application/json");

function tick(){var d=new Date(),h=d.getHours(),t,ap="";if(S.h24)t=p2(h)+":"+p2(d.getMinutes());else{t=(h%12||12)+":"+p2(d.getMinutes());ap=h>=12?"PM":"AM"}

function ico(c,s){var C='<path d="M14 36a8 8 0 0 1-1-16 11 11 0 0 1 21 3 7 7 0 0 1 0 13z" fill="#c7cdd6"/>',SU='<circle cx="24" cy="24" r="9" fill="#ffcc00"/><path d="M24 5v6M24 37v6M5 24h6M37 24h6M11 11l4 4M33 33l4 4M37 11l-4 4M15 33l-4 4" stroke="#ffcc00" stroke-width="3" stroke-linecap="round"/>',b;
if(c<=1)b=SU;else if(c==2)b='<circle cx="18" cy="17" r="8" fill="#ffcc00"/>'+C;else if(c==3||c==45||c==48)b=C;
else if(c>=71&&c<=77||c==85||c==86)b=C+'<circle cx="18" cy="42" r="2" fill="#5ac8fa"/><circle cx="26" cy="44" r="2" fill="#5ac8fa"/><circle cx="34" cy="42" r="2" fill="#5ac8fa"/>';
else if(c>=95)b=C+'<path d="M26 32l-6 9h5l-2 6 8-10h-5z" fill="#ffcc00"/>';else b=C+'<path d="M18 40l-2 5M26 40l-2 5M34 40l-2 5" stroke="#007aff" stroke-width="2.5" stroke-linecap="round"/>';

function loadWx(){if(wxBusy)return;wxBusy=true;clearTimeout(wxT);wxErr="";renderWx();
var city=S.loc.split(",")[0];
xhr("GET","https://geocoding-api.open-meteo.com/v1/search?count=1&name="+encodeURIComponent(city),null,function(e,t){

function wxDone(e){wxBusy=false;var d;if(e){wxErr=e;wxFail++;d=Math.min(30*Math.pow(2,wxFail),S.refresh*60)}else{wxFail=0;d=S.refresh*60}wxT=setTimeout(loadWx,d*1000);renderWx();status()}

else{var c=wx.current,d=wx.daily;h+='<div style="display:flex;align-items:center">'+ico(c.weather_code,84)+'<div class="temp" style="margin-left:14px">'+cv(c.temperature_2m)+'</div><div style="margin-left:18px;font-size:18px">'+(WD[c.weather_code]||"")+'<div class="sub">H '+cv(d.temperature_2m_max[0])+'  L '+cv(d.temperature_2m_min[0])+'<br>Humidity '+c.relative_humidity_2m+'%</div></div></div><div class="fc">';

function pd(s){var m=/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)(Z?))?/.exec(s);if(!m)return null;if(!m[4])return new Date(+m[1],m[2]-1,+m[3]);if(m[7])return new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5]));return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5])}
function loadCal(){calMsg="";if(!S.ics){evs=demoEv();renderCal();return}
xhr("GET",S.ics,null,function(e,t){if(e){calMsg="Couldn't load calendar feed ("+e+"). Feeds usually need a CORS proxy.";evs=[];renderCal();return}
var L=t.replace(/\r?\n[ \t]/g,"").split(/\r?\n/),o=[],c=null,i,l;for(i=0;i<L.length;i++){l=L[i];if(l=="BEGIN:VEVENT")c={};else if(l=="END:VEVENT"){if(c&&c.t&&c.s)o.push(c);c=null}else if(c){if(l.indexOf("DTSTART")==0)c.t=pd(l.split(":").pop());else if(l.indexOf("SUMMARY")==0)c.s=l.substr(l.indexOf(":")+1)}}
o.sort(function(a,b){return a.t-b.t});evs=o;renderCal()})}
function renderCal(){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),f=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate(),has={},i,h;
for(i=0;i<evs.length;i++)if(evs[i].t.getMonth()==m&&evs[i].t.getFullYear()==y)has[evs[i].t.getDate()]=1;
h='<h2>Calendar'+(S.ics?"":'<span class="badge">SAMPLE EVENTS</span>')+'</h2><div class="card pad"><div style="font-size:20px;margin-bottom:6px">'+MON[m]+' '+y+'</div><table><tr>';
for(i=0;i<7;i++)h+="<th>"+DAYS[i].substr(0,1)+"</th>";h+="</tr><tr>";var c;for(i=0;i<f;i++)h+="<td></td>";
for(var d=1;d<=dim;d++){c=(f+d-1)%7;if(c==0&&d>1)h+="</tr><tr>";h+="<td>"+(d==n.getDate()?'<b class="t">'+d+"</b>":"<b>"+d+"</b>")+(has[d]?"<u></u>":"")+"</td>"}
h+="</tr></table></div><div class='card' style='margin-top:10px'>";

$("p-cal").innerHTML=h+"</div>"}
/* ---- smart home ---- */
var devs=[],hmsg="";
function initDevs(){var a;try{a=JSON.parse(S.devs)}catch(e){a=JSON.parse(DD);hmsg="Device list is not valid JSON; using defaults."}

var CL=[[255,147,41],[255,255,255],[255,59,48],[0,122,255],[76,217,100]];

/* ---- settings ---- */

/* ---- shell ---- */
